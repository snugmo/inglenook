# The no-tpm image variant: an encrypted root is a LUKS2 volume with an empty
# key slot (the installer made it with systemd-repart's Encrypt=key-file),
# never sealed to a TPM - so this image's initrd ships this drop-in and the
# tpm2 variant's does not. gpt-auto-generator's ExecStart carries the TPM2
# options on a measured boot, and those must not run here: the measure flags
# switch FIDO2 from the token plugins to the in-tree path, which fails a
# fresh (no-token) volume, so the mode is a property of the image and each
# variant carries its own static options (docs/encryption.md). The plugin
# path: no token yet is non-fatal (-EAGAIN) and the empty slot
# (try-empty-password) unlocks hands-off; once a FIDO2 token is enrolled it
# unlocks, the PIN through ask-password (plymouth in the initrd).
[Service]
ExecStart=
ExecStart=/usr/bin/systemd-cryptsetup attach root /dev/gpt-auto-root-luks '' 'fido2-device=auto,try-empty-password=true'
