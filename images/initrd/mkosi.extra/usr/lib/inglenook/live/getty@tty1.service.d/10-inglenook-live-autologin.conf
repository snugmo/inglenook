# Copied to /run/systemd/system by inglenook-live-state.service in the initrd,
# so it only applies to live boots. The live stick is an installer: the console
# logs in as root without a password, so a password can be set for the account
# that is installed (passwd, or homed provisioning). The installed system boots
# without this drop-in.
[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --autologin root --noreset --noclear - ${TERM}
