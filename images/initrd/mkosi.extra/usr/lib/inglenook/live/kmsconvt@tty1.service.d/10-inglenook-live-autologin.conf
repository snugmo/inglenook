# See getty@tty1.service.d. On this image the virtual console on tty1 is kmscon
# (kmsconvt@.service is the alias autovt@.service that logind starts), not
# agetty, so the live autologin has to go through kmscon's login command.
# getty@tty1 stays covered too: kmscon falls back to it (OnFailure=).
[Service]
ExecStart=
ExecStart=kmscon --vt=%I --no-switchvt --login -- /bin/login -p -f root
