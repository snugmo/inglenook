# The first-boot /var safety net (the no-TPM case): the same partition as
# repart.d/60-var.conf, but the LUKS2 volume gets an empty key slot instead of
# being sealed to a (absent) TPM - the documented zero-length-key default of
# systemd-repart's Encrypt=key-file. It unlocks hands-off (try-empty-password)
# until a FIDO2 token or a recovery key is enrolled, and enrolling one later
# needs no encrypt-in-place, which a plain filesystem would. See
# inglenook-var-repart.service for when this runs.
[Partition]
Type=var
Label=var
Format=xfs
Encrypt=key-file
