# Opt-in (inglenook.var=xfs on the kernel command line): all of /var on its own
# XFS partition, in whatever free space follows the root partition. Created in
# the initrd by inglenook-var-repart.service (--definitions=/usr/lib/inglenook/
# repart.d, not /usr/lib/repart.d, which would also trigger the stock service),
# mounted by inglenook-var-mount.service.
[Partition]
Type=var
Label=var
Format=xfs
