# The first-boot /var safety net (the TPM case): all of /var on its own XFS
# partition in whatever free space follows the root partition. A fresh install
# already has the partition (the installer made it, seeded by the machine id),
# so this only creates it on a system installed before that, or by `bootc
# install`, which has no installer. Created by inglenook-var-repart.service
# (a wrapper picks this directory when a TPM is present), mounted by
# inglenook-var-mount.service. The definition is kept out of /usr/lib/repart.d
# on purpose: files there make the stock systemd-repart.service run in the
# initrd, where it fails.
[Partition]
Type=var
Label=var
Format=xfs
# LUKS2, its key sealed to the TPM (no PCR policy yet, like bootc's tpm2-luks
# root); the first-boot wizard (systemd-cryptenroll --firstboot) can add a
# recovery key or FIDO2 tokens. The no-TPM twin is repart-no-tpm.d/60-var.conf.
Encrypt=tpm2
