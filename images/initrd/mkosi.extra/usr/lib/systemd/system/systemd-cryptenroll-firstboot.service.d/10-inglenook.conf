[Unit]
# The wizard asks on the console for a recovery key / FIDO2 token for /var. A machine that is
# provisioned without anyone at the console (the tests, an unattended install) puts
# inglenook.cryptenroll=no on the kernel command line. (systemd.mask= does not stop it in the
# initrd; systemd.firstboot=no does, but it also stops the homed wizard that creates the first user.)
# On a fresh install this unit is a no-op anyway: the installer wrote the machine id into the
# new system, so the stock ConditionFileNotEmpty=!/sysroot/etc/machine-id does not hold, and
# the volume already has the keys the installer gave it (an empty-slot volume is classified
# as a plain password slot, which is in --prompt-suppress, so even a run would exit silently).
# It still acts on a system installed before the installer provisioned /var.
ConditionKernelCommandLine=!inglenook.cryptenroll=no
