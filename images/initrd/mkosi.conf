# The initrd for the composefs boot path, built with mkosi instead of dracut.
#
# mkosi's stock initrd profile supplies systemd, udev and the kernel module
# list (erofs, overlay, ext4, xfs, virtio_*, vsock, ...). All inglenook adds is
# what dracut's 51bootc module used to: bootc's initramfs-setup binary and
# bootc-root-setup.service, hooked into initrd-root-fs.target by the symlink
# under mkosi.extra/. build.sh supplies the parts that come from the image
# being built, as extra trees: the kernel modules directory and the bootc
# binary and unit (see images/build.sh).
[Include]
Include=mkosi-initrd

[Distribution]
Distribution=fedora
Release=45

[Output]
Output=initrd
Format=cpio
