# The initrd for the composefs boot path, built with mkosi instead of dracut.
#
# mkosi's stock initrd profile supplies systemd, udev and the kernel module
# list (erofs, overlay, ext4, xfs, virtio_*, vsock, ...). All inglenook adds is
# what dracut's 51bootc module used to: bootc's initramfs-setup binary and
# bootc-root-setup.service, hooked into initrd-root-fs.target by the symlink
# under mkosi.extra/. build.sh supplies the parts that come from the image
# being built, as extra trees: the kernel modules directory and the bootc
# binary and unit (see images/build.sh).
[Include]
Include=mkosi-initrd

[Config]
# plymouth (and the system theme) in the initrd: it shows the prompts of
# systemd-ask-password (the PINs of FIDO2 keys and the TPM) on the screen.
Profiles=plymouth

[Distribution]
Distribution=fedora
Release=45

[Output]
Output=initrd
Format=cpio

[Content]
# setfiles, to label what inglenook-etc-restore.service writes.
Packages=policycoreutils

# mkfs.xfs, for the opt-in XFS /var (inglenook.var=xfs; see repart.d/60-var.conf).
Packages=xfsprogs

# USB attached SCSI, for boot sticks that speak UAS; xHCI, SCSI disk and
# usb-storage's fallback path are already built in or in the stock list.
KernelModules=uas
