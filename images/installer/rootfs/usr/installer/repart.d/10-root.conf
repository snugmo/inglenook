# The root filesystem: the installed system (bootc, composefs) and its state.
# systemd-repart's config files are static text, so the run-time values are not
# here: inglenook-install appends to a copy of this file the size the user chose
# (SizeMinBytes/SizeMaxBytes) and the encryption (Encrypt=tpm2 when sealed to
# the TPM, Encrypt=key-file on the no-tpm image: a LUKS2 empty key slot that
# unlocks hands-off and can receive a FIDO2 token later; nothing when the root
# is left unencrypted). ext4, because composefs needs fs-verity (the installer's
# SYSTEMD_REPART_MKFS_OPTIONS_EXT4 adds -O verity). All the space after the
# root becomes /var (60-var.conf).
[Partition]
Type=root
Label=root
Format=ext4
