# The root filesystem: the installed system (bootc, composefs) and its state.
# systemd-repart's config files are static text, so the run-time values are not
# here: inglenook-install appends the size the user chose (SizeMinBytes/SizeMaxBytes)
# and, when encryption is selected, Encrypt=tpm2 (LUKS2, key sealed to the machine's
# TPM) to a copy of this file. ext4, because composefs needs fs-verity (the installer's
# SYSTEMD_REPART_MKFS_OPTIONS_EXT4 adds -O verity). The free space that follows on the
# disk (once the temporary scratch partition is removed) becomes /var on the first
# boot, made by the installed system's initrd.
[Partition]
Type=root
Label=root
Format=ext4
