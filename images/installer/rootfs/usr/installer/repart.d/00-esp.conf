# The EFI system partition. The layout (and its sizes) follows the old kvm-host installer's
# 00-esp.conf; bootc fills it (systemd-boot, the UKI) and the installer adds addons later.
[Partition]
Type=esp
Label=ESP
Format=vfat
MakeDirectories=/EFI/Linux /EFI/BOOT
MakeDirectories=/loader/credentials /loader/addons
# fwupd's capsule update application, from the installer's own fwupd-efi package
# (in images/installer/mkosi.conf): inglenook-install passes --copy-source=/ so the
# source resolves against the installer's running root (in the initrd repart would
# default to /sysroot, which is empty there). Once, at install time; keeping the
# ESP copy current across upgrades is for the future.
CopyFiles=/usr/libexec/fwupd/efi/fwupdx64.efi:/EFI/BOOT/fwupdx64.efi
SizeMinBytes=1G
SizeMaxBytes=1G
