# The EFI system partition. The layout (and its sizes) follows the old kvm-host installer's
# 00-esp.conf; bootc fills it (systemd-boot, the UKI) and the installer adds addons later.
[Partition]
Type=esp
Label=ESP
Format=vfat
MakeDirectories=/EFI/Linux /EFI/BOOT
MakeDirectories=/loader/credentials /loader/addons
SizeMinBytes=1G
SizeMaxBytes=1G
