# /var: all the space after the root, XFS on LUKS2. Created here, in the
# installer (not on the first boot: the initrd's copy of this definition,
# images/initrd/mkosi.extra, is a safety net for legacy installs only). While
# the install runs the volume doubles as the scratch space the image is copied
# into; inglenook-install cleans it before it becomes the running system's
# /var. The LUKS2 key is sealed to the machine's TPM (Encrypt=tpm2, appended
# by the installer when there is a TPM to seal to) or an empty key slot
# (Encrypt=key-file: unlocks with the empty password until a FIDO2 token or a
# recovery key is enrolled). No size: whatever is left on the disk. The
# partition, LUKS2 and filesystem UUIDs are all derived from the machine id
# the installer generates and passes as --seed.
[Partition]
Type=var
Label=var
Format=xfs
