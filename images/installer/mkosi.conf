# The packages of the installer overlay (the user-facing tools of the
# installer addon; see build-addon.sh). Only /usr of the resulting tree is
# used, minus everything the boot initrd already has. Add a tool by adding its
# package here; the scripts do not change.
[Distribution]
Distribution=fedora
Release=45

[Output]
Format=directory
Output=installer

[Content]
Bootable=no
WithDocs=no
# No weak dependencies: only what the packages below need.
WithRecommends=no

# Disk provisioning and debugging; gdisk's GPT handling is nicer than fdisk's.
Packages=gdisk

# Filesystems and volumes.
Packages=util-linux
Packages=xfsprogs
Packages=btrfs-progs
Packages=cryptsetup
Packages=fuse3
Packages=dosfstools
Packages=nvme-cli
Packages=pciutils
Packages=attr
Packages=acl
Packages=libselinux-utils
Packages=tpm2-tools

# Network debugging, fetching and archives.
Packages=iputils
Packages=iproute
Packages=bind-utils
Packages=curl-minimal
Packages=git-core
Packages=tar
Packages=gzip
Packages=bzip2
Packages=zstd
Packages=xz
Packages=zip
Packages=unzip

# Looking around.
Packages=procps-ng
Packages=less
Packages=which
