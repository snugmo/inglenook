# PID 1 creates its own varlink sockets in the initrd, before any SELinux policy is loaded, so
# they get the directory's label (init_var_run_t) and /run is carried over to the real root as is.
# This one has a file-context entry of its own (systemd_oomd_var_run_t); relabel it from the policy.
z /run/systemd/io.systemd.ManagedOOM - - - -
