# The first user. Root is locked and there is no other account, so this wizard (enabled in the
# Containerfile) is how anyone gets in. The installer leaves a home.create.<name> credential in
# /etc/credstore, which the wizard turns into the account without asking; without one it prompts on
# the console. Either way the user may use run0 (wheel).
[Unit]
# Not ConditionFirstBoot: on this image it is never true in the real system, because the initrd's
# systemd has already initialized the machine ID by then. homectl firstboot is idempotent (it creates
# the credential users, then skips the prompt when a regular user exists), so run it while homed has
# no user record. (Not "the directory is empty": homed puts its signing keys, local.private and
# local.public, into /var/lib/systemd/home when it starts.) ExecCondition: success runs the unit, a
# failure skips it quietly.
ConditionFirstBoot=

[Service]
ExecCondition=/bin/sh -c '! ls /var/lib/systemd/home/*.identity >/dev/null 2>&1'
ExecStart=
ExecStart=homectl firstboot --prompt-new-user --prompt-shell=no --prompt-groups=no --member-of=wheel --mute-console=yes
# the credential holds the password: gone once the account exists
ExecStartPost=-/bin/sh -c 'rm -f /etc/credstore/home.create.*'
