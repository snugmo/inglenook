# tuned-ppd writes /var/log/tuned/tuned-ppd.log but nothing creates the directory
# with a label on a fresh /var: the daemon makes it itself, it gets the generic
# var_log_t and SELinux denies tuned_ppd_t opening its own log. LogsDirectory=
# makes systemd create it and apply the file-context label (tuned_log_t).
[Service]
LogsDirectory=tuned
