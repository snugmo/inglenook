# The stock unit only imports the credentials for root, so a password set for
# any other account (for example passwd.hashed-password.user, delivered on the
# ESP of a USB stick) never reaches systemd-sysusers. It applies them when it
# creates the account, i.e. on first boot.
[Service]
ImportCredential=passwd.hashed-password.*
ImportCredential=passwd.plaintext-password.*
ImportCredential=passwd.shell.*
