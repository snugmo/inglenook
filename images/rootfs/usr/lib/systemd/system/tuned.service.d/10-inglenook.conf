# /var/log/tuned: no tmpfiles rule ships the directory, and the first writer
# (this service; tuned-ppd requires it and starts after it) would create it
# itself on a fresh /var: a daemon-created directory gets the generic
# var_log_t label, and tuned_ppd_t then has no business creating its log in
# it. LogsDirectory= makes systemd create the directory instead, applying the
# file-context label (tuned_log_t, see matchpathcon) before either daemon
# starts; the base policy grants both of them that type.
[Service]
LogsDirectory=tuned
