<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
Inject foundry=GOOG into any request for the "Noto Color Emoji" family, so
FcFontSort (used by fcft/foot) only matches the 3D (sbix) and 2D (CBDT)
builds from the GitHub release (foundry GOOG) and excludes the RPM's COLRv1
build (foundry NONE) and the monochrome NotoEmoji-Regular (also not GOOG).
fcft uses the first FcFontSort candidate as the face; a rejected primary
(COLRv1) fails the whole family, so foot would fall through to monochrome.
A pattern-level rule is needed: font-level edits (prefer, weight) do not
affect FcFontSort ordering. The foundry attribute is the reliable selector
because it is not part of the family name pattern an app sends (foot just
sends the family) — this rule adds it on behalf of all users, so no
per-user foot.ini edit is needed.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="foundry" mode="prepend">
      <string>GOOG</string>
    </edit>
  </match>
</fontconfig>
