# systemd-homed users keep their ssh keys in the user record (the
# sshAuthorizedKeys field), not in ~/.ssh/authorized_keys.
#
# There is deliberately no AuthenticationMethods here: requiring "publickey,password"
# locks out accounts without a password (token-only homed users, root).
AuthorizedKeysCommand /usr/bin/userdbctl ssh-authorized-keys %u
AuthorizedKeysCommandUser root
